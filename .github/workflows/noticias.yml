name: Coleta de notícias (a cada 2 horas)

on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Janela de coleta em dias (deixe vazio para o padrão do config.json; use 7 para recompor desde a eleição)'
        required: false
        default: ''
      enviar_teste:
        description: 'Enviar agora um resumo de teste (últimas 24 horas) aos destinatários, sem alterar o marco dos envios'
        type: boolean
        required: false
        default: false
  schedule:
    # A cada 2 horas, das 06h17 às 20h17 em Brasília (UTC-3). Só há commit e implantação quando surgem notícias novas.
    # O resumo por e-mail e o levantamento de contratos suspensos saem nas execuções de 08h17, 12h17 e 18h17 (11h, 15h e 21h UTC).
    - cron: '17 9,11,13,15,17,19,21,23 * * *'

permissions:
  contents: write

concurrency:
  group: coleta-noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar as notícias
        env:
          DIAS: ${{ inputs.dias }}
        run: |
          if [ -n "$DIAS" ]; then
            [[ "$DIAS" =~ ^[0-9]{1,3}$ ]] || { echo "dias deve ser um número"; exit 1; }
            python3 -I pipeline/noticias/coletar.py --dias "$DIAS"
          else
            python3 -I pipeline/noticias/coletar.py
          fi

      # Contratos suspensos, rescindidos ou anulados (SIGA): leva cerca de 1 minuto, por isso só nos horários do resumo e nos disparos manuais.
      # Roda antes do e-mail para que o resumo já traga o que há de novo. Falha aqui não impede a publicação das notícias.
      - name: Detectar contratos suspensos (08h17, 12h17 e 18h17, ou disparo manual)
        id: suspensos
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          HORA=$(date -u +%H)
          if [ "$EVENTO" = "workflow_dispatch" ] || { [ "$EVENTO" = "schedule" ] && { [ "$HORA" = "11" ] || [ "$HORA" = "15" ] || [ "$HORA" = "21" ]; }; }; then
            python3 -I pipeline/contratos/suspensos.py
          else
            echo "Fora do horário do levantamento: nada a fazer nesta execução."
          fi

      # Falha no e-mail não impede a publicação das notícias; o último passo deixa a execução vermelha para o aviso chegar.
      - name: Enviar o resumo por e-mail (08h17, 12h17 e 18h17, ou teste manual)
        id: enviar
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
          TESTE: ${{ inputs.enviar_teste }}
          NOTICIAS_DESTINATARIOS: ${{ secrets.NOTICIAS_DESTINATARIOS }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_REMETENTE: ${{ secrets.SMTP_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORTA: ${{ vars.SMTP_PORTA }}
          PAINEL_URL: ${{ vars.PAINEL_URL }}
        run: |
          HORA=$(date -u +%H)
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$TESTE" = "true" ]; then
            python3 -I pipeline/noticias/enviar.py --teste
          elif [ "$EVENTO" = "schedule" ] && { [ "$HORA" = "11" ] || [ "$HORA" = "15" ] || [ "$HORA" = "21" ]; }; then
            python3 -I pipeline/noticias/enviar.py
          else
            echo "Fora do horário do resumo: nada a enviar nesta execução."
          fi

      - name: Gravar no repositório (só data/noticias e data/suspensos; o deploy sai do push)
        run: |
          if [ -z "$(git status --porcelain -- data/noticias data/suspensos)" ]; then
            echo "Sem mudanças."; exit 0
          fi
          git config user.name "coleta-noticias"
          git config user.email "coleta-noticias@users.noreply.github.com"
          git add data/noticias data/suspensos
          git commit -m "dados: notícias e contratos de $(date -u +%F)"
          for tentativa in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((tentativa * 5))
          done
          echo "Não foi possível enviar a coleta."; exit 1

      - name: Avisar se o e-mail ou o levantamento de contratos falhou
        if: steps.enviar.outcome == 'failure' || steps.suspensos.outcome == 'failure'
        run: |
          echo "O resumo por e-mail ou o levantamento de contratos suspensos falhou (veja os passos acima). As notícias foram publicadas normalmente."
          exit 1
