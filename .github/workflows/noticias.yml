name: Coleta de notícias (a cada hora, das 06h às 22h)

on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Janela de coleta em dias (deixe vazio para o padrão do config.json; use 7 para recompor desde a eleição)'
        required: false
        default: ''
      enviar_teste:
        description: 'Enviar agora um resumo de teste (últimas 24 horas) aos destinatários, sem alterar o marco dos envios'
        type: boolean
        required: false
        default: false
      agendado:
        description: 'Disparo feito por agendador externo (cron-job.org): trata como execução agendada, enviando o resumo se estiver vencido'
        type: boolean
        required: false
        default: false
  schedule:
    # A cada hora, aos 17 minutos, das 06h17 às 22h17 em Brasília (UTC-3): 17 coletas por dia, sem coleta de madrugada.
    # O agendador do GitHub é "melhor esforço" e pula execuções; por isso há um segundo disparador, externo, que chama este mesmo fluxo
    # pela API (workflow_dispatch com agendado=true). Os dois podem coexistir: a fila (concurrency) e o marco do envio evitam duplicidade.
    # Cada coleta grava data/noticias/verificacao.json (a tela mostra "Última verificação"), então há um commit e uma implantação por coleta.
    # O GitHub costuma pular execuções agendadas, por isso o resumo por e-mail e o levantamento de contratos não dependem de um
    # horário exato: saem na primeira execução depois de 08h17, 12h17 ou 18h17 (11h17, 15h17 e 21h17 UTC) que ainda não tenha enviado.
    - cron: '17 0,1,9-23 * * *'

permissions:
  contents: write

concurrency:
  group: coleta-noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar as notícias
        env:
          DIAS: ${{ inputs.dias }}
        run: |
          if [ -n "$DIAS" ]; then
            [[ "$DIAS" =~ ^[0-9]{1,3}$ ]] || { echo "dias deve ser um número"; exit 1; }
            python3 -I pipeline/noticias/coletar.py --dias "$DIAS"
          else
            python3 -I pipeline/noticias/coletar.py
          fi

      # Atos de contrato no Diário Oficial (paralisação, suspensão, rescisão...): lê só as edições novas (e as de hoje e de ontem), leva segundos.
      # Roda a cada coleta, antes do e-mail, para o resumo já trazer o que saiu. Falha aqui não impede a publicação das notícias.
      - name: Ler o Diário Oficial (atos de contrato)
        id: diario
        continue-on-error: true
        run: python3 -I pipeline/diario/coletar.py

      # Há um horário de resumo vencido (08h17, 12h17 ou 18h17) sem e-mail enviado depois dele? Se sim, esta execução faz o levantamento e o envio.
      - name: Ver se há resumo vencido
        id: devido
        run: echo "sim=$(python3 -I pipeline/noticias/enviar.py --devido)" >> "$GITHUB_OUTPUT"

      # Contratos suspensos, rescindidos ou anulados (SIGA): leva cerca de 1 minuto, por isso só quando há resumo vencido e nos disparos manuais.
      # Roda antes do e-mail para que o resumo já traga o que há de novo. Falha aqui não impede a publicação das notícias.
      - name: Detectar contratos suspensos (resumo vencido ou disparo manual)
        id: suspensos
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
          DEVIDO: ${{ steps.devido.outputs.sim }}
          AGENDADO: ${{ inputs.agendado }}
        run: |
          # disparo manual (sem agendado): sempre; agendado (GitHub ou externo): só com resumo vencido
          if { [ "$EVENTO" = "workflow_dispatch" ] && [ "$AGENDADO" != "true" ]; } || { [ "$DEVIDO" = "sim" ] && { [ "$EVENTO" = "schedule" ] || [ "$AGENDADO" = "true" ]; }; }; then
            python3 -I pipeline/contratos/suspensos.py
          else
            echo "Sem resumo vencido: nada a fazer nesta execução."
          fi

      # Obras paralisadas e com contrato rescindido no Portal da Transparência (com a data da situação): leva de 1 a 2 minutos na primeira vez e menos nas seguintes.
      # Mesma regra do levantamento de contratos: só quando há resumo vencido e nos disparos manuais. Falha aqui não impede a publicação das notícias.
      - name: Ler as obras paralisadas (resumo vencido ou disparo manual)
        id: obras
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
          DEVIDO: ${{ steps.devido.outputs.sim }}
          AGENDADO: ${{ inputs.agendado }}
        run: |
          # disparo manual (sem agendado): sempre; agendado (GitHub ou externo): só com resumo vencido
          if { [ "$EVENTO" = "workflow_dispatch" ] && [ "$AGENDADO" != "true" ]; } || { [ "$DEVIDO" = "sim" ] && { [ "$EVENTO" = "schedule" ] || [ "$AGENDADO" = "true" ]; }; }; then
            python3 -I pipeline/obras/coletar.py
          else
            echo "Sem resumo vencido: nada a fazer nesta execução."
          fi

      # Falha no e-mail não impede a publicação das notícias; o último passo deixa a execução vermelha para o aviso chegar.
      - name: Enviar o resumo por e-mail (resumo vencido ou teste manual)
        id: enviar
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
          DEVIDO: ${{ steps.devido.outputs.sim }}
          TESTE: ${{ inputs.enviar_teste }}
          AGENDADO: ${{ inputs.agendado }}
          NOTICIAS_DESTINATARIOS: ${{ secrets.NOTICIAS_DESTINATARIOS }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_REMETENTE: ${{ secrets.SMTP_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORTA: ${{ vars.SMTP_PORTA }}
          PAINEL_URL: ${{ vars.PAINEL_URL }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$TESTE" = "true" ]; then
            python3 -I pipeline/noticias/enviar.py --teste
          elif { [ "$EVENTO" = "schedule" ] || { [ "$EVENTO" = "workflow_dispatch" ] && [ "$AGENDADO" = "true" ]; }; } && [ "$DEVIDO" = "sim" ]; then
            python3 -I pipeline/noticias/enviar.py
          else
            echo "Sem resumo vencido: nada a enviar nesta execução."
          fi

      - name: Gravar no repositório (só data/noticias, data/suspensos, data/atos e data/obras; o deploy sai do push)
        run: |
          if [ -z "$(git status --porcelain -- data/noticias data/suspensos data/atos data/obras)" ]; then
            echo "Sem mudanças."; exit 0
          fi
          git config user.name "coleta-noticias"
          git config user.email "coleta-noticias@users.noreply.github.com"
          # só os caminhos que existem: "git add" com um caminho ausente (ex.: data/obras antes do primeiro levantamento) falha e não guarda nada
          for d in data/noticias data/suspensos data/atos data/obras; do if [ -e "$d" ]; then git add "$d"; fi; done
          git commit -m "dados: notícias e contratos de $(date -u +%F)"
          for tentativa in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((tentativa * 5))
          done
          echo "Não foi possível enviar a coleta."; exit 1

      - name: Avisar se o e-mail, o levantamento de contratos, a leitura do Diário ou a das obras falhou
        if: steps.enviar.outcome == 'failure' || steps.suspensos.outcome == 'failure' || steps.diario.outcome == 'failure' || steps.obras.outcome == 'failure'
        run: |
          echo "O resumo por e-mail, o levantamento de contratos suspensos ou a leitura do Diário Oficial ou a das obras falhou (veja os passos acima). As notícias foram publicadas normalmente."
          exit 1
