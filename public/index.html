<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Painel Fiscal ES</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="form-login" class="login-caixa" autocomplete="off">
      <h1>Painel Fiscal · ES</h1>
      <p class="sub">Acesso restrito. Informe a senha recebida.</p>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit" class="botao-primario">Entrar</button>
      <p id="login-erro" class="erro" role="alert" hidden></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="cabeca">
      <div class="cabeca-in">
        <a class="marca" href="#/cargos" aria-label="Painel Fiscal ES, início">
          <svg class="logo" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="7" fill="currentColor"/><rect x="6.5" y="17" width="5" height="8.5" rx="1" fill="var(--pagina)"/><rect x="13.5" y="11.5" width="5" height="14" rx="1" fill="var(--pagina)"/><rect x="20.5" y="6" width="5" height="19.5" rx="1" fill="var(--pagina)"/></svg>
          <span class="marca-texto"><b>Painel Fiscal</b><small>Espírito Santo · análise para a transição</small></span>
        </a>
        <nav id="paineis" class="chave" aria-label="Painéis"></nav>
        <div class="cabeca-acoes">
          <button id="tema" class="botao" type="button" aria-label="Alternar tema claro e escuro">Tema</button>
          <button id="sair" class="botao" type="button">Sair</button>
        </div>
      </div>
      <div id="progresso" class="progresso" role="progressbar" aria-label="Carregando dados" hidden></div>
    </header>
    <p id="aviso-aberto" class="faixa-aberto" hidden role="note">Ambiente de teste, aberto a quem tiver o endereço. Os dados vêm de fontes públicas, mas incluem nomes e valores de pessoas: não divulgue o link.</p>
    <div class="corpo">
      <nav id="abas" class="subnav" aria-label="Telas do painel" hidden></nav>
      <main id="modulo"></main>
    </div>
  </div>

  <div id="dica" class="dica" role="tooltip" hidden></div>
  <script src="core.js"></script>
  <script src="graficos.js"></script>
  <script src="compartilhar.js"></script>
  <script src="modulos/cargos.js"></script>
  <script src="modulos/organograma.js"></script>
  <script src="modulos/politico.js"></script>
  <script src="modulos/contratacoes.js"></script>
  <script src="modulos/fimmandato.js"></script>
  <script src="modulos/lacunas.js"></script>
</body>
</html>
