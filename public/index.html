<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Painel Fiscal ES</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="form-login" class="login-caixa" autocomplete="off">
      <h1>Painel Fiscal · ES</h1>
      <p class="sub">Acesso restrito. Informe a senha recebida.</p>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit" class="botao-primario">Entrar</button>
      <p id="login-erro" class="erro" role="alert" hidden></p>
    </form>
  </section>

  <div id="app" hidden>
    <p id="aviso-aberto" class="faixa-aberto" hidden role="note">Ambiente de teste, aberto a quem tiver o endereço. Os dados vêm de fontes públicas, mas incluem nomes e valores de pessoas: não divulgue o link.</p>
    <div class="layout">
      <aside class="lateral">
        <div class="marca"><h1>Painel Fiscal</h1><p>Espírito Santo · Poder Executivo</p></div>
        <nav id="abas" class="menu" aria-label="Seções do painel"></nav>
        <div class="lateral-rodape">
          <button id="tema" class="botao" type="button" aria-label="Alternar tema claro e escuro">Tema</button>
          <button id="sair" class="botao" type="button">Sair</button>
        </div>
      </aside>
      <main id="modulo"></main>
    </div>
  </div>

  <div id="dica" class="dica" role="tooltip" hidden></div>
  <script src="core.js"></script>
  <script src="graficos.js"></script>
  <script src="modulos/cargos.js"></script>
  <script src="modulos/organograma.js"></script>
  <script src="modulos/contratacoes.js"></script>
  <script src="modulos/lacunas.js"></script>
</body>
</html>
